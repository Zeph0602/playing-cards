<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playing cards</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- コイン & アカウント表示（常時上部） -->
  <div class="top-bar">
    <div id="authStatus" class="auth-status">
      <span id="userEmailDisplay">未ログイン</span>
      <button id="authBtn" class="auth-btn" onclick="handleAuthAction()">ログイン</button>
    </div>
    <div class="coin-display">💰 コイン: <span id="coinCount">0</span></div>
  </div>

  <!-- 1. メインメニュー画面 -->
  <div id="startScreen" class="screen active">
    <div class="container">
      <h1 class="title">playing cards</h1>
      
      <div class="menu-nav">
        <button class="nav-btn" onclick="showScreen('deckScreen')">🎴 デッキ編集</button>
        <button class="nav-btn gacha-nav-btn" onclick="showScreen('gachaScreen')">🎰 ガチャ</button>
      </div>

      <div class="mode-card">
        <h2>対戦モード選択</h2>
        <div class="mode-buttons">
          <button class="mode-btn active" id="btnCpuMode" onclick="selectMode('cpu')">CPU対戦</button>
          <button class="mode-btn" id="btnOnlineMode" onclick="selectMode('online')">オンライン対戦</button>
        </div>

        <div id="onlinePanel" class="online-panel" style="display: none;">
          <div class="online-box">
            <h3>部屋を作る</h3>
            <button class="sub-btn" onclick="createRoom()">ID発行</button>
            <div id="roomIdDisplay" class="room-id-box" style="display: none;"></div>
          </div>
          <div class="divider">OR</div>
          <div class="online-box">
            <h3>部屋に入る</h3>
            <div class="input-group">
              <input type="text" id="joinRoomId" placeholder="ルームID" />
              <button class="sub-btn" onclick="joinRoom()">参加</button>
            </div>
          </div>
          <div id="connectionStatus" class="status-msg"></div>
        </div>
      </div>

      <button id="startBtn" class="start-btn" onclick="startGame()">対戦開始！</button>
    </div>
  </div>

  <!-- 2. デッキ編集画面 -->
  <div id="deckScreen" class="screen">
    <div class="container">
      <header class="screen-header">
        <button class="back-btn" onclick="showScreen('startScreen')">← メニューへ</button>
        <h2>デッキ編集</h2>
      </header>
      <p class="sub-desc">1〜10のカードに装着する効果を選択してください。（各効果カードは1つの数字にのみ装着可能）</p>
      
      <div class="deck-grid" id="deckGrid"></div>

      <div id="effectSelectModal" class="modal" style="display: none;">
        <div class="modal-content">
          <h3>装着する効果を選択 (カード <span id="targetCardNum"></span>)</h3>
          <div class="inventory-list" id="inventoryList"></div>
          <button class="close-btn" onclick="closeModal()">キャンセル</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. ガチャ画面 -->
  <div id="gachaScreen" class="screen">
    <div class="container">
      <header class="screen-header">
        <button class="back-btn" onclick="showScreen('startScreen')">← メニューへ</button>
        <h2>カード効果ガチャ</h2>
      </header>
      
      <div class="gacha-actions">
        <button class="gacha-btn" onclick="drawGacha(1)">1連ガチャ (5C)</button>
        <button class="gacha-btn special" onclick="drawGacha(11)">11連ガチャ (50C)</button>
      </div>

      <div class="gacha-results" id="gachaResults"></div>
    </div>
  </div>

  <!-- 4. 対戦画面 -->
  <div id="gameScreen" class="screen">
    <div class="container game-layout">
      <header class="game-header">
        <button class="back-home-btn" onclick="goToStart()">← 参戦離脱</button>
        <div class="turn-badge">ROUND <span id="turnNum">1</span> / 10</div>
      </header>

      <div class="score-board">
        <div class="score-player">
          <span class="player-name">YOU</span>
          <span class="score-val" id="pScore">0</span>
        </div>
        <div class="score-vs">VS</div>
        <div class="score-player">
          <span class="player-name" id="oppName">CPU</span>
          <span class="score-val" id="cScore">0</span>
        </div>
      </div>

      <div class="field">
        <div class="card-display">
          <div class="card-wrapper">
            <div class="owner-label">YOU</div>
            <div class="card-slot" id="pCardSlot">-</div>
            <div class="effect-tag" id="pEffectDesc"></div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="card-wrapper">
            <div class="owner-label" id="oppCardLabel">CPU</div>
            <div class="card-slot" id="cCardSlot">-</div>
            <div class="effect-tag" id="cEffectDesc"></div>
          </div>
        </div>
        <div class="result-message" id="resultMsg">カードを選択してください</div>
      </div>

      <div class="hand-section">
        <h3>あなたの手札</h3>
        <div class="hand-container" id="playerHand"></div>
      </div>
    </div>
  </div>

  <!-- ログイン / アカウント作成モーダル -->
  <div id="authModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 id="authTitle">アカウント ログイン / 登録</h3>
      <div class="auth-form">
        <input type="email" id="authEmail" placeholder="メールアドレス" class="auth-input">
        <input type="password" id="authPassword" placeholder="パスワード（6文字以上）" class="auth-input">
        <div class="auth-btn-group">
          <button class="sub-btn" onclick="loginUser()">ログイン</button>
          <button class="sub-btn register-btn" onclick="registerUser()">新規登録</button>
        </div>
        <div id="authError" class="status-msg" style="color: #ef4444; margin-top: 8px;"></div>
      </div>
      <button class="close-btn" style="margin-top: 12px;" onclick="closeAuthModal()">閉じる</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
