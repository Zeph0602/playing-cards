<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playing cards</title>
  <!-- PeerJSライブラリ -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1ページ目: スタート画面 -->
  <div id="startScreen" class="screen active">
    <div class="container">
      <h1 class="title">playing cards</h1>
      <p class="subtitle">1〜10のカードを駆使する心理戦カードゲーム</p>

      <!-- モード選択・対戦準備エリア -->
      <div class="mode-card">
        <h2>対戦モード選択</h2>
        
        <div class="mode-buttons">
          <button class="mode-btn active" id="btnCpuMode" onclick="selectMode('cpu')">CPU対戦</button>
          <button class="mode-btn" id="btnOnlineMode" onclick="selectMode('online')">オンライン対戦</button>
        </div>

        <!-- オンライン対戦用パネル -->
        <div id="onlinePanel" class="online-panel" style="display: none;">
          <div class="online-box">
            <h3>部屋を作る（ホスト）</h3>
            <button class="sub-btn" onclick="createRoom()">ルームIDを発行</button>
            <div id="roomIdDisplay" class="room-id-box" style="display: none;"></div>
          </div>

          <div class="divider">OR</div>

          <div class="online-box">
            <h3>部屋に入る（ゲスト）</h3>
            <div class="input-group">
              <input type="text" id="joinRoomId" placeholder="ルームIDを入力" />
              <button class="sub-btn" onclick="joinRoom()">参加</button>
            </div>
          </div>
          
          <div id="connectionStatus" class="status-msg"></div>
        </div>
      </div>

      <div class="rule-card">
        <h2>ルール概要</h2>
        <div class="rule-grid">
          <div class="rule-item"><span>1</span> 10に勝つ（8には無効）</div>
          <div class="rule-item"><span>2</span> 小さい方が勝ち</div>
          <div class="rule-item"><span>3</span> 負けても相手pt増えない</div>
          <div class="rule-item"><span>4</span> 勝つと相手pt -1</div>
          <div class="rule-item"><span>5</span> 次回の数字 +2</div>
          <div class="rule-item"><span>6</span> 勝つと獲得pt +2</div>
          <div class="rule-item"><span>7</span> 相手効果の無効化</div>
          <div class="rule-item"><span>8</span> 数字「12」として扱う</div>
          <div class="rule-item"><span>9</span> 次回を強制引き分け</div>
          <div class="rule-item"><span>10</span> 2の効果を無視</div>
        </div>
      </div>

      <button id="startBtn" class="start-btn" onclick="startGame()">CPU戦を開始する</button>
    </div>
  </div>

  <!-- 2ページ目: 対戦画面 -->
  <div id="gameScreen" class="screen">
    <div class="container game-layout">
      
      <header class="game-header">
        <button class="back-home-btn" onclick="goToStart()">← タイトルへ</button>
        <div class="turn-badge">ROUND <span id="turnNum">1</span> / 10</div>
      </header>

      <div class="score-board">
        <div class="score-player">
          <span class="player-name">YOU</span>
          <span class="score-val" id="pScore">0</span>
        </div>
        <div class="score-vs">VS</div>
        <div class="score-player">
          <span class="player-name" id="oppName">OPPONENT</span>
          <span class="score-val" id="cScore">0</span>
        </div>
      </div>

      <div class="field">
        <div class="card-display">
          <div class="card-wrapper">
            <div class="owner-label">YOU</div>
            <div class="card-slot" id="pCardSlot">-</div>
            <div class="effect-tag" id="pEffectDesc"></div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="card-wrapper">
            <div class="owner-label" id="oppCardLabel">OPPONENT</div>
            <div class="card-slot" id="cCardSlot">-</div>
            <div class="effect-tag" id="cEffectDesc"></div>
          </div>
        </div>
        <div class="result-message" id="resultMsg">カードを選択してください</div>
      </div>

      <div class="hand-section">
        <h3>あなたの手札</h3>
        <div class="hand-container" id="playerHand"></div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
